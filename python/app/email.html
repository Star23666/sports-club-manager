<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background: #f5f5f5; margin: 0; padding: 20px">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08)">
  <tr>
    <td style="padding: 32px 32px 20px; text-align: center; border-bottom: 3px solid #2ecc71">
      <h1 style="margin: 0; color: #2c3e50; font-size: 22px">🏸 [org_name]</h1>
    </td>
  </tr>
  <tr>
    <td style="padding: 24px 32px">
      <p style="margin: 0 0 12px; font-size: 15px; color: #333">Dear <b>[username]</b>,</p>
      <p style="margin: 0 0 20px; font-size: 14px; color: #555">You have requested to reset your password. Please use the verification code below:</p>
      <div style="background: #eafaf1; border: 1px solid #2ecc71; border-radius: 8px; padding: 16px 24px; text-align: center; margin: 0 0 20px">
        <span style="font-size: 28px; font-weight: bold; letter-spacing: 6px; color: #2c3e50">[verify-code]</span>
      </div>
      <p style="margin: 0 0 8px; font-size: 12px; color: #999">⏰ This code will expire in <b>30 minutes</b>.</p>
      <p style="margin: 0; font-size: 12px; color: #999">🔒 If you did not request this, please ignore this email.</p>
    </td>
  </tr>
  <tr>
    <td style="padding: 16px 32px 24px; text-align: center; border-top: 1px solid #eee">
      <p style="margin: 0; font-size: 11px; color: #bbb">[org_name]</p>
    </td>
  </tr>
</table>
</body>
</html>
