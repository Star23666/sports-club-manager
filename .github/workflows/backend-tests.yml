name: Tests and builds

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r python/requirements.txt pytest 'httpx<1'
      - name: Run tests
        run: python -m pytest -q
  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frontend: [client-front-end, admin-front-end]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.frontend }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.frontend }}
      - name: Build
        run: npm run build
        working-directory: ${{ matrix.frontend }}
