services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: must-badminton-py-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: badminton1
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: must-badminton-py-backend
    environment:
      DB_HOST: mysql
      DB_TYPE: mysql
      DB_PORT: 3306
      DB_NAME: badminton1
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      PORT: 8081
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  client:
    build:
      context: ./client-front-end
      dockerfile: Dockerfile
    container_name: must-badminton-py-client
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  admin:
    build:
      context: ./admin-front-end
      dockerfile: Dockerfile
    container_name: must-badminton-py-admin
    depends_on:
      - backend
    ports:
      - "8082:80"
    restart: unless-stopped

volumes:
  mysql_data:
